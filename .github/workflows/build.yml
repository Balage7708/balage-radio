name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NAME: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform files
        run: flutter create --platforms=android --org hu.balagedrone --project-name balage_radio .
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Build APK
        run: flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-name=$BUILD_NAME --build-number=${{ github.run_number }}
      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/BalageRadio-${BUILD_NAME}-android.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/BalageRadio-${BUILD_NAME}-android-regi-telefon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform files
        run: flutter create --platforms=windows --org hu.balagedrone --project-name balage_radio .
      - run: python ci/patch_windows.py
      - run: flutter pub get
      - name: Build Windows
        run: flutter build windows --release --build-name=${{ env.BUILD_NAME }} --build-number=${{ github.run_number }}
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:APP_VERSION = "${{ env.BUILD_NAME }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ci\installer.iss
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\BalageRadio-${{ env.BUILD_NAME }}-windows-hordozhato.zip
          Rename-Item dist\BalageRadio-Setup.exe "BalageRadio-${{ env.BUILD_NAME }}-windows-telepito.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}
          name: Balage Rádió ${{ env.BUILD_NAME }}
          body: |
            **Android:** `...-android.apk` (régi, 32 bites telefonokra: `...-regi-telefon.apk`)
            **Windows:** `...-windows-telepito.exe` (vagy a hordozható ZIP)
          files: out/*
