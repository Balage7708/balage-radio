name: Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

env:
  BUILD_NAME: 1.0.${{ github.run_number }}

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform files
        run: flutter create --platforms=android --org hu.balagedrone --project-name balage_radio .
      - run: flutter pub get
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee -a ci-android.log
      - name: Build APK
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi --target-platform android-arm,android-arm64 --build-name=$BUILD_NAME --build-number=${{ github.run_number }} 2>&1 | tee -a ci-android.log
      - name: Rename
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/BalageRadio-${BUILD_NAME}-android.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/BalageRadio-${BUILD_NAME}-android-regi-telefon.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: dist/*.apk
      - name: Push log on failure
        if: failure()
        run: |
          cp ci-android.log /tmp/ci.log 2>/dev/null || echo "no log" > /tmp/ci.log
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-android
          git rm -rfq --cached . && git clean -fdxq -e ci.log || true
          cp /tmp/ci.log ci.log && git add -f ci.log && git commit -qm "android log ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs-android

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate missing platform files
        run: flutter create --platforms=windows --org hu.balagedrone --project-name balage_radio .
      - run: python ci/patch_windows.py
      - run: flutter pub get
      - name: Build Windows
        shell: bash
        run: |
          set -o pipefail
          flutter build windows --release --build-name=${{ env.BUILD_NAME }} --build-number=${{ github.run_number }} 2>&1 | tee -a ci-windows.log
      - name: Installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $env:APP_VERSION = "${{ env.BUILD_NAME }}"
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" ci\installer.iss
          Compress-Archive -Path build\windows\x64\runner\Release\* -DestinationPath dist\BalageRadio-${{ env.BUILD_NAME }}-windows-hordozhato.zip
          Rename-Item dist\BalageRadio-Setup.exe "BalageRadio-${{ env.BUILD_NAME }}-windows-telepito.exe"
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*
      - name: Push log on failure
        if: failure()
        shell: bash
        run: |
          cp ci-windows.log /tmp/ci.log 2>/dev/null || echo "no log" > /tmp/ci.log
          git config user.name ci && git config user.email ci@users.noreply.github.com
          git checkout --orphan ci-logs-windows
          git rm -rfq --cached . && git clean -fdxq -e ci.log || true
          cp /tmp/ci.log ci.log && git add -f ci.log && git commit -qm "windows log ${{ github.run_number }}"
          git push -f origin HEAD:ci-logs-windows

  release:
    needs: [android, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.BUILD_NAME }}
          name: Balage Rádió ${{ env.BUILD_NAME }}
          body: |
            **Android:** `...-android.apk` (régi, 32 bites telefonokra: `...-regi-telefon.apk`)
            **Windows:** `...-windows-telepito.exe` (vagy a hordozható ZIP)
          files: out/*
