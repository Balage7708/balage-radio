name: balage_radio
description: Balage Rádió – saját webrádió-lejátszó (Windows, Android).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  media_kit: ^1.1.11
  media_kit_libs_audio: ^1.0.5
  audio_service: ^0.18.15
  audio_session: ^0.1.21
  file_picker: ^8.1.2
  shared_preferences: ^2.3.0
  http: ^1.2.0
  path_provider: ^2.1.0
  path: ^1.9.0
  url_launcher: ^6.3.0
  share_plus: ^10.0.0
  open_filex: ^4.5.0
  window_manager: ^0.4.2
  flutter_local_notifications: ^18.0.0
  timezone: ^0.10.0
  google_fonts: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
